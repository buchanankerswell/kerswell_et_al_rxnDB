<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rxnDB — Mineral Reaction Database</title>
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><strong>rxnDB</strong><span>Mineral Reaction Database</span></div>
    <div class="controls">
      <input id="query" type="search" placeholder="Search minerals, authors, IDs… (e.g. Qz Coe)" size="40" aria-label="Search reactions">
      <select id="reaction_type" aria-label="Reaction type">
        <option value="">all types</option>
        <option value="phase_boundary">phase_boundary</option>
        <option value="calibration">calibration</option>
        <option value="melting_curve">melting_curve</option>
      </select>
      <button id="export" type="button">Download JSON</button>
    </div>
  </div>
</header>
<main>
<div id="layout">
  <div class="card side">
    <p class="hint">Press <kbd>/</kbd> to search. Click a reaction to fit it.</p>
    <p id="count" role="status" aria-live="polite"></p>
    <hr>
    <ul id="reaction_list"></ul>
  </div>
  <div>
    <div class="card plot-wrap"><div id="plot"></div></div>
    <div class="card table-wrap" style="margin-top:1rem">
      <table id="table">
        <thead><tr><th>reaction</th><th>T (°C)</th><th>P (GPa)</th><th>outcome</th><th>source</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="foot">Curves clip to their stated valid ranges. Entries marked <em>review</em> are suspect.</p>
  </div>
</div>
</main>
</body>
</html>
