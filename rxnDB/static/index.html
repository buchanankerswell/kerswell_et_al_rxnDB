<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rxnDB — Mineral Reaction Database</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><strong>rxnDB</strong><span>Mineral Reaction Database</span></div>
    <div class="controls">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.2"></circle>
          <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
        </svg>
        <input id="query" type="search" placeholder="Search minerals, authors, IDs… (press / to search)" size="40" aria-label="Search reactions">
      </div>
      <select id="reaction_type" aria-label="Reaction type">
        <option value="">all types</option>
        <option value="phase_boundary">phase_boundary</option>
        <option value="calibration">calibration</option>
        <option value="melting_curve">melting_curve</option>
      </select>
      <button id="export" type="button">Download JSON</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Views">
    <div class="tabs-inner">
      <a href="/" data-tab="reactions" aria-current="true">Reactions</a>
      <a href="/observations" data-tab="observations" aria-current="false">Observations</a>
      <span id="tab_indicator" aria-hidden="true"></span>
    </div>
  </nav>
</header>
<main>
<div id="view-reactions" class="tab-panel" role="tabpanel" aria-label="Reactions explorer">
<div id="layout">
  <section class="card side" aria-label="Reactions">
    <div class="section-head">
      <h2>Reactions</h2>
      <p id="count" role="status" aria-live="polite"></p>
    </div>
    <ul id="reaction_list"></ul>
  </section>
  <div class="main-col">
    <section class="card plot-card" aria-label="Phase diagram">
      <div class="section-head">
        <h2>Phase Diagram</h2>
      </div>
      <div class="plot-body">
        <svg id="plot" viewBox="0 0 720 560" role="img" aria-label="Phase diagram"></svg>
        <div id="plot_tip" class="plot-tip" hidden></div>
        <button id="plot_reset" type="button" hidden>Reset view</button>
      </div>
    </section>
  </div>
</div>
</div>
<div id="view-observations" class="tab-panel" role="tabpanel" aria-label="Observations table" hidden>
  <section class="card table-card" aria-label="Observations">
    <div class="section-head">
      <h2>Observations</h2>
      <p id="obs_count" role="status" aria-live="polite"></p>
    </div>
    <div class="table-wrap">
      <table id="table">
        <thead><tr><th>reaction</th><th>phases</th><th class="num">T (&deg;C)</th><th class="num">P (GPa)</th><th>type</th><th>source</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>
</main>
</body>
</html>
